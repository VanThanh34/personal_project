server {
    listen 80;
    server_name localhost;

    # Phục vụ giao diện React
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Dòng này cực kỳ quan trọng để React Router không bị lỗi 404 khi F5 trang
        try_files $uri $uri/ /index.html;
    }

    # --- Cấu hình Proxy thay thế cho vite.config.js ---

    location /api {
        proxy_pass http://backend:8080;
    }

    location /auth {
        proxy_pass http://backend:8080;
    }

    location /admin {
        proxy_pass http://backend:8080;
    }

    location /games {
        proxy_pass http://backend:8080;
    }

    location /downloads {
        proxy_pass http://backend:8080;
    }
}